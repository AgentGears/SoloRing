name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history: the M11 BOUNDARY:05 proof diffs against the M10F
      # baseline commit, which a shallow checkout does not contain.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate proof map
        run: python scripts/m10f_validate_proof_map.py
      - name: Validate M11 proof map
        run: python scripts/m11_validate_proof_map.py
      - name: Validate M12 proof map
        run: python scripts/m12_validate_proof_map.py
      - name: M13 proof map
        run: python scripts/m13_validate_proof_map.py
      - name: M13 boundary
        run: python scripts/m13_validate_boundary.py
      - name: Hygiene proof map
        run: python scripts/hygiene_validate_proof_map.py
      - name: Hygiene boundary
        run: python scripts/hygiene_validate_boundary.py
      - name: Next security proof map
        run: python scripts/next_security_validate_proof_map.py
      - name: Next security boundary
        run: python scripts/next_security_validate_boundary.py
      - name: No repo-root generated residue
        run: python -c "from pathlib import Path; assert not Path('m10f-scale-pkgs').exists(), 'repo-root residue present'"

      - name: Run backend tests
        run: python -m pytest -q

      # Post-suite: a regression that recreates the directory DURING
      # pytest must still fail the job — the pre-suite check above
      # cannot see it (frozen R2 HYG-08 permanent proof).
      - name: No repo-root generated residue (post-suite)
        run: python -c "from pathlib import Path; assert not Path('m10f-scale-pkgs').exists(), 'repo-root residue present after backend suite'"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Next security pins
        run: python ../../scripts/next_security_validate.py --pins-only

      - name: Run frontend tests
        run: npm test

      - name: Next type generation
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          SOLORING_API_ORIGIN: http://127.0.0.1:65534
        run: npm run build

      - name: Runtime dependency audit + Next security audit
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/nsec-audit.json" || true
          python ../../scripts/hygiene_validate_npm_audit.py "$RUNNER_TEMP/nsec-audit.json"
          python ../../scripts/next_security_validate.py "$RUNNER_TEMP/nsec-audit.json"
