name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Full history remains available to the proof-map validators that
      # legitimately inspect predecessor lineage.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Historical proof maps remain useful regression ownership checks.
      # Milestone-boundary/source-fit validators are intentionally NOT run
      # here once a reviewed successor milestone is authorized: by design
      # they reject new successor files/migrations and therefore become
      # ceremony rather than a product-integrity signal. Current-milestone
      # focused tests plus the full suite are the publication gates.
      - name: Validate proof map
        run: python scripts/m10f_validate_proof_map.py
      - name: Validate M11 proof map
        run: python scripts/m11_validate_proof_map.py
      - name: Validate M12 proof map
        run: python scripts/m12_validate_proof_map.py
      - name: M13 proof map
        run: python scripts/m13_validate_proof_map.py
      - name: Hygiene proof map
        run: python scripts/hygiene_validate_proof_map.py
      - name: Next security proof map
        run: python scripts/next_security_validate_proof_map.py
      - name: M14 proof map
        run: python scripts/m14_validate_proof_map.py
      - name: M15 proof map
        run: python scripts/m15_validate_proof_map.py
      - name: M16 proof map
        run: python scripts/m16_validate_proof_map.py
      - name: M17B proof map
        run: python scripts/m17b_validate_proof_map.py

      - name: M17C focused tests
        run: >-
          python -m pytest -q
          tests/test_m17c_binding_authority.py
          tests/test_m17c_binding_transitions.py
          tests/test_m17c_migration.py

      - name: No repo-root generated residue
        run: python -c "from pathlib import Path; assert not Path('m10f-scale-pkgs').exists(), 'repo-root residue present'"

      - name: Run backend tests
        # The post-M15 recovery regression suite intentionally lives at the
        # reviewed server/tests path; name it explicitly so it is collected in
        # addition to the repository's configured tests/ root.
        run: python -m pytest -q tests server/tests/test_post_m15_recovery_hardening.py

      - name: No repo-root generated residue (post-suite)
        run: python -c "from pathlib import Path; assert not Path('m10f-scale-pkgs').exists(), 'repo-root residue present after backend suite'"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Next security pins
        run: python ../../scripts/next_security_validate.py --pins-only

      - name: Run frontend tests
        run: npm test

      - name: Next type generation
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          SOLORING_API_ORIGIN: http://127.0.0.1:65534
        run: npm run build

      - name: Runtime dependency audit + Next security audit
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/nsec-audit.json" || true
          python ../../scripts/hygiene_validate_npm_audit.py "$RUNNER_TEMP/nsec-audit.json"
          python ../../scripts/next_security_validate.py "$RUNNER_TEMP/nsec-audit.json"
